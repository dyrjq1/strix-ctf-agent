name: build-image

# 为什么在 CI 里构建：本地（国内网络）到 deb.debian.org 和 pypi.org 都是几分钟起步，
# 一次 build 十几分钟还可能超时；GitHub runner 在境外，官方源反而最快。
# 构建完直接推 ghcr.io，平台那边填的就是这个地址。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag"
        required: false
        default: "1.0.0"
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/strix-ctf-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 ghcr 必需

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（只出 amd64）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # 平台 worker 是 amd64；不指定 platforms 时 buildx 默认就是宿主架构，
          # 这里显式写死，避免以后 runner 换成 arm 时静默产出拉不动的镜像。
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag || '1.0.0' }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 单元测试
        # 构建成功只证明镜像能起来；真正的接线错误（守卫没挂、工具没注册、
        # 提示里写着镜像没有的命令）只有测试能看见。放在 conformance 之前。
        #
        # tests/ 被 .dockerignore 排除（不进交付镜像），所以这里把它 bind-mount
        # 进容器：依赖用镜像里装好的那一份，代码用本次 checkout 的同一份，
        # 两者正是"交付物"和"测的东西"应当一致的关系。
        run: |
          set -eux
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e PYTHONPATH=/app/src:/app/vendor/src \
            "${{ env.IMAGE }}:${{ inputs.tag || '1.0.0' }}" \
            python3 -m pytest /repo/tests -q -p no:cacheprovider

      # 平台的两条 blocking 判据（did_not_start / no_result_file）在 CI 里先过一遍。
      # 构建成功 ≠ conformance 通过，这一步才是真正的门。
      - name: conformance 自检（无 task.json）
        run: |
          set -eux
          mkdir -p /tmp/w1 && rm -rf /tmp/w1/*
          # 镜像内是非 root（UID 1000）；runner 建的目录属于 UID 1001，
          # 不改属主的话容器写不进挂载目录，conformance 测的是权限不是契约。
          sudo chown -R 1000:1000 /tmp/w1
          docker run --rm -w /ctfy/work -e CTFY_WORK_DIR=/ctfy/work \
            -v /tmp/w1:/ctfy/work "${{ env.IMAGE }}:${{ inputs.tag || '1.0.0' }}"
          test -s /tmp/w1/result.json
          python3 -c "import json;d=json.load(open('/tmp/w1/result.json'));print(d)"

      - name: conformance 自检（dry_run + 自定义 result 路径）
        run: |
          set -eux
          mkdir -p /tmp/w2/out && rm -rf /tmp/w2/out/*
          sudo chown -R 1000:1000 /tmp/w2
          cat > /tmp/w2/task.json <<'JSON'
          {"schema_version": 2, "dry_run": true, "run_mode": "instance",
           "challenge": {"name": "smoke"}, "scope": [],
           "result": {"path": "out/result.json"}}
          JSON
          docker run --rm -w /ctfy/work -e CTFY_WORK_DIR=/ctfy/work \
            -v /tmp/w2:/ctfy/work "${{ env.IMAGE }}:${{ inputs.tag || '1.0.0' }}"
          test -s /tmp/w2/out/result.json
          # The schema version follows the protocol, not this file.  Pinning
          # 2 here made the build fail the day the agent started writing 3 --
          # a conformance check that rejects the correct answer.
          python3 -c "import json;d=json.load(open('/tmp/w2/out/result.json'));assert d.get('schema_version')>=2;print(d.get('schema_version'), d.get('stop_reason'))"

      - name: 摘要
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:${{ inputs.tag || '1.0.0' }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "提交到 CTFY 时填上面那行地址。"
          } >> "$GITHUB_STEP_SUMMARY"
